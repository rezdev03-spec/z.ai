<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <title>ZennNyx AI</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar" aria-label="ZennNyx AI header">
      <div class="brand-title">ZennNyx 1.0 Flash</div>
      <div class="brand-meta"><span class="status-dot"></span><span>AI ASSISTANT</span><span>·</span><span>GROQ</span></div>
    </header>

    <section id="chat" class="chat" aria-live="polite">
      <div id="welcome" class="welcome">
        <div class="welcome-mark">Z</div>
        <h1>How can I help?</h1>
        <p>Ask anything, write something, or build an idea.</p>
        <div class="suggestions">
          <button type="button" data-prompt="Explain something interesting to me.">Explain something</button>
          <button type="button" data-prompt="Help me write a short paragraph.">Help me write</button>
          <button type="button" data-prompt="Give me a creative idea for a website.">Give me an idea</button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <div id="imagePreview" class="image-preview" hidden></div>
      <div class="mode-row">
        <button id="thinkBtn" class="think-toggle" type="button" aria-pressed="false">
          <span class="think-icon">✦</span><span>Think Harder</span>
        </button>
        <span id="modeHint" class="mode-hint">Short, direct answers</span>
      </div>

      <form id="composer" class="composer">
        <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
        <button id="attachBtn" class="icon-btn attach-btn" type="button" aria-label="Attach image" title="Attach image">+</button>
        <textarea id="input" rows="1" maxlength="8000" placeholder="Message ZennNyx AI..." autocomplete="off" enterkeyhint="send"></textarea>
        <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message">↑</button>
      </form>
      <p class="disclaimer">ZennNyx AI can make mistakes. Check important information.</p>
    </div>
  </main>
  <script src="/script.js"></script>
</body>
</html>
