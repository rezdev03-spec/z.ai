<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZennNyx AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
        chtml: { displayAlign: 'left' }
      };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="top-bar">
                <span class="status"><span class="pulse-dot"></span> GROQ • LPU ENGINE</span>
                <span id="clock" class="clock">00.00.00</span>
            </div>
            <div class="marquee-container">
                <marquee scrollamount="4">> SYSTEM_ONLINE > ZennNyx AI (Groq Engine) > AWAITING_COMMAND ></marquee>
            </div>
        </header>

        <main id="chat-box">
            <div class="message system fade-in">
                [SYS] ZennNyx AI terhubung ke Groq LPU Engine.
                <br>> Siap menerima instruksi.
            </div>
        </main>

        <footer>
            <!-- Menu Pemilih Model -->
            <div class="model-selector-container">
                <button id="model-selector-btn" class="model-btn">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg> Flash
                </button>
                <div class="model-dropdown" id="model-dropdown">
                    <div class="model-option active" data-value="false">
                        <span class="model-icon">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                        </span>
                        <div class="model-text">
                            <strong>Flash (Llama 3.3 70B)</strong>
                            <span>Respons ultra cepat, singkat, hemat kuota.</span>
                        </div>
                    </div>
                    <div class="model-option" data-value="true">
                        <span class="model-icon">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        </span>
                        <div class="model-text">
                            <strong>Pro (DeepSeek R1)</strong>
                            <span>Penalaran logika murni, analisis komprehensif.</span>
                        </div>
                    </div>
                </div>
                <span id="file-indicator" class="file-status"></span>
            </div>
            
            <!-- Input Area -->
            <div class="input-wrapper">
                <label for="image-upload" class="icon-btn" title="Upload Gambar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                </label>
                <input type="file" id="image-upload" accept="image/*" hidden>
                
                <input type="text" id="user-input" placeholder="> Ketik perintah di sini..." autocomplete="off">
                
                <button id="send-btn" class="icon-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
