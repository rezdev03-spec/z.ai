<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f7f7f8" />
  <title>ZennNyx AI</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar" aria-label="ZennNyx AI header">
      <div class="header-fade" aria-hidden="true"></div>

      <div class="topbar-controls topbar-left">
        <button id="menuBtn" class="topbar-btn glass-btn" type="button" aria-label="About ZennNyx AI" title="About ZennNyx AI">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>

      <div class="brand-title">ZennNyx AI</div>

      <div class="topbar-controls topbar-right">
        <button id="newChatBtn" class="topbar-btn glass-btn" type="button" aria-label="New chat" title="New chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h4L19.4 8.6a2 2 0 0 0-2.8-2.8L6.2 16.2 5 19Z"/><path d="m14.9 7.1 2 2"/></svg>
        </button>
      </div>
    </header>

    <div id="aboutPopover" class="glass-popover about-popover" hidden role="dialog" aria-label="About ZennNyx AI">
      <div class="about-mark">Z</div>
      <div class="about-title">ZennNyx AI</div>
      <div class="about-text">AI assistant untuk ngobrol, belajar, menganalisis gambar, dan membantu berbagai ide sehari-hari.</div>
      <div class="about-dev">Dev <strong>@zennlonevyn</strong></div>
    </div>

    <section id="chat" class="chat" aria-live="polite">
      <div id="welcome" class="welcome">
        <div class="welcome-mark">Z</div>
        <h1>How can I help?</h1>
        <p>Ask anything, write something, or build an idea.</p>
        <div class="suggestions">
          <button type="button" data-prompt="Explain something interesting to me.">Explain something</button>
          <button type="button" data-prompt="Help me write a short paragraph.">Help me write</button>
          <button type="button" data-prompt="Give me a creative idea for a website.">Give me an idea</button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <div id="imagePreview" class="image-preview" hidden></div>

      <div class="composer-shell">
        <form id="composer" class="composer">
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
          <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden />

          <button id="attachBtn" class="icon-btn" type="button" aria-label="Open attach menu" title="Attach">
            <span class="plus-icon" aria-hidden="true">+</span>
          </button>

          <textarea id="input" rows="1" maxlength="8000" placeholder="Message ZennNyx AI..." autocomplete="off" enterkeyhint="enter" spellcheck="true"></textarea>

          <button id="voiceBtn" class="voice-btn" type="button" aria-label="Voice input" title="Voice input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Z"/><path d="M19 11v1a7 7 0 0 1-14 0v-1"/><path d="M12 19v3M9 22h6"/></svg>
          </button>

          <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message" title="Send message">
            <svg class="send-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>
          </button>
        </form>
      </div>

      <div id="attachPopover" class="glass-popover attach-popover" hidden role="menu" aria-label="Attachments and Think Harder">
        <button class="attach-menu-item" type="button" data-action="camera">
          <span class="menu-item-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h3l1.4-2h5.2L16 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.2"/></svg>
          </span>
          <span class="menu-item-text"><strong>Camera</strong><small>Ambil foto langsung</small></span>
        </button>

        <button class="attach-menu-item" type="button" data-action="photo">
          <span class="menu-item-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m5 17 4.3-4 3 2.8 2.1-1.9L19 18"/></svg>
          </span>
          <span class="menu-item-text"><strong>Photo</strong><small>Pilih gambar dari galeri</small></span>
        </button>

        <button id="thinkMenuBtn" class="attach-menu-item" type="button" data-action="think" aria-pressed="false">
          <span class="menu-item-icon think-menu-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.2a4 4 0 0 0-3.5 4A3.9 3.9 0 0 0 7 15.5 3.7 3.7 0 0 0 10.2 19h1.1V6.2A3.5 3.5 0 0 0 9 4.2Z"/><path d="M15 4.2a4 4 0 0 1 3.5 4 3.9 3.9 0 0 1-1.5 7.3A3.7 3.7 0 0 1 13.8 19h-1.1V6.2A3.5 3.5 0 0 1 15 4.2Z"/><path d="M8 9h3M13 9h3M8.3 13h2.7M13 13h2.7M10.2 6.6v3M13.8 14.1v3"/></svg>
          </span>
          <span class="menu-item-text"><strong>Think Harder</strong><small>Jawaban lebih mendalam</small></span>
          <span class="menu-check" aria-hidden="true">✓</span>
        </button>
      </div>
    </div>
  </main>
  <script src="/script.js"></script>
</body>
</html>
