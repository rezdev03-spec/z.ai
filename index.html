<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#ffffff" />
  <title>ZennNyx AI</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar" aria-label="ZennNyx AI header">
      <div class="header-fade" aria-hidden="true"></div>
      <div class="topbar-controls topbar-left">
        <button id="menuBtn" class="topbar-btn" type="button" aria-label="About ZennNyx AI" title="About ZennNyx AI">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
      <div class="brand-title">ZennNyx 1.0 Flash</div>
      <div class="brand-meta"><span class="status-dot"></span><span>AI ASSISTANT</span></div>
      <div class="topbar-controls topbar-right">
        <button id="newChatBtn" class="topbar-btn" type="button" aria-label="New chat" title="New chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19h4L19.4 8.6a2 2 0 0 0-2.8-2.8L6.2 16.2 5 19Z"/><path d="m14.9 7.1 2 2"/></svg>
        </button>
      </div>
    </header>

    <div id="aboutPopover" class="about-popover" hidden role="dialog" aria-label="About ZennNyx AI">
      <div class="about-mark">Z</div>
      <div class="about-title">ZennNyx AI</div>
      <div class="about-text">AI assistant untuk ngobrol, belajar, menganalisis gambar, dan membantu berbagai ide sehari-hari.</div>
      <div class="about-dev">Dev <strong>@zennlonevyn</strong></div>
    </div>

    <section id="chat" class="chat" aria-live="polite">
      <div id="welcome" class="welcome">
        <div class="welcome-mark">Z</div>
        <h1>How can I help?</h1>
        <p>Ask anything, write something, or build an idea.</p>
        <div class="suggestions">
          <button type="button" data-prompt="Explain something interesting to me.">Explain something</button>
          <button type="button" data-prompt="Help me write a short paragraph.">Help me write</button>
          <button type="button" data-prompt="Give me a creative idea for a website.">Give me an idea</button>
        </div>
      </div>
    </section>

    <div class="composer-wrap">
      <div id="imagePreview" class="image-preview" hidden></div>

      <div class="composer-shell">
        <form id="composer" class="composer">
          <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
          <button id="attachBtn" class="icon-btn attach-btn" type="button" aria-label="Attach image" title="Attach image">+</button>
          <textarea id="input" rows="1" maxlength="8000" placeholder="Message ZennNyx AI..." autocomplete="off" enterkeyhint="enter" spellcheck="true"></textarea>
          <div class="think-area">
            <button id="thinkBtn" class="think-toggle" type="button" aria-pressed="false" aria-label="Think Harder" title="Think Harder">
              <span class="think-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M9.2 4.2a4 4 0 0 0-3.7 3.9A3.8 3.8 0 0 0 6.2 15a3.6 3.6 0 0 0 3.1 4.8h2.1a1.6 1.6 0 0 0 1.6-1.6V6.1A3.6 3.6 0 0 0 9.2 4.2Z"/>
                  <path d="M14.8 4.2a4 4 0 0 1 3.7 3.9 3.8 3.8 0 0 1-.7 6.9 3.6 3.6 0 0 1-3.1 4.8h-2.1a1.6 1.6 0 0 1-1.6-1.6V6.1a3.6 3.6 0 0 1 3.8-1.9Z"/>
                  <path d="M8 9h3M13 9h3M8.2 13h2.8M13 13h2.8M10.4 6.5v3M13.6 14v3"/>
                </svg>
              </span>
            </button>
            <div id="thinkPopover" class="think-popover" role="dialog" aria-label="Think Harder" hidden>
              <div class="think-popover-row">
                <div class="think-popover-title">Think Harder</div>
                <button id="thinkSwitch" class="think-switch" type="button" role="switch" aria-checked="false" aria-label="Toggle Think Harder">
                  <span></span>
                </button>
              </div>
            </div>
          </div>
          <button id="sendBtn" class="send-btn" type="submit" aria-label="Send message" title="Send message">
            <span class="send-icon" aria-hidden="true">↑</span>
          </button>
        </form>
      </div>
    </div>
  </main>
  <script src="/script.js"></script>
</body>
</html>
